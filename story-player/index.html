<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雲卷雲書 說故事</title>
  <style>
    :root {
      --bg: #000000;
      --card: #161616;
      --yellow: #FFD400;
      --white: #FFFFFF;
      --disabled-bg: #2a2a2a;
      --disabled-fg: #9a9a9a;
      --gap: 28px;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--white);
      font-family: "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei",
                   "PingFang TC", "Heiti TC", "Source Han Sans TC", sans-serif;
      font-weight: 700;
      font-size: 40px;
      line-height: 1.35;
      min-height: 100%;
    }
    body { min-height: 100vh; }
    button {
      font: inherit;
      font-weight: 700;
      color: inherit;
      cursor: pointer;
      border: 6px solid var(--yellow);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--white);
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible, a:focus-visible {
      outline: 8px solid var(--white);
      outline-offset: 4px;
    }
    button:disabled {
      background: var(--disabled-bg);
      color: var(--disabled-fg);
      border-color: #555;
      cursor: default;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 28px 80px;
    }
    h1 {
      font-size: 64px;
      line-height: 1.2;
      color: var(--yellow);
      margin-bottom: 12px;
    }
    .hint {
      font-size: 40px;
      color: var(--white);
      margin-bottom: 32px;
    }
    #continue-wrap {
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    #continue-wrap[hidden] { display: none; }
    .btn-continue {
      width: 100%;
      text-align: left;
      background: var(--yellow);
      color: #000;
      border-color: var(--yellow);
      padding: 32px 36px;
      min-height: 150px;
    }
    .btn-continue .big { font-size: 56px; display: block; margin-bottom: 10px; }
    .btn-continue .sub { font-size: 40px; display: block; }
    .btn-continue:hover, .btn-continue:focus-visible { filter: brightness(1.08); }
    .series-list {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }
    .series-card {
      width: 100%;
      text-align: left;
      padding: 32px 36px;
      min-height: 180px;
      background: var(--card);
      border: 6px solid var(--yellow);
    }
    .series-card:hover, .series-card:focus-visible {
      background: var(--yellow);
      color: #000;
    }
    .series-card:hover .meta, .series-card:focus-visible .meta { color: #000; }
    .series-card .name { font-size: 52px; display: block; margin-bottom: 12px; }
    .series-card .meta { font-size: 40px; color: var(--yellow); display: block; }
    .series-card .meta + .meta { margin-top: 4px; }

    /* 首頁 預覽：上方一列 + 3x3 格 + 翻頁 */
    .home2 { padding: 0 12px 24px; }
    .home-main {
      height: 100vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    .home-top {
      display: flex;
      gap: 12px;
      align-items: stretch;
      margin-bottom: 10px;
      flex: 0 0 auto;
    }
    .home-top .title-box {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 4px 0;
    }
    .home-top .title-box .t { font-size: clamp(32px, 3.8vw, 48px); color: var(--yellow); line-height: 1.2; }
    .home-top .title-box .h { font-size: clamp(22px, 2.6vw, 30px); color: var(--white); }
    .btn-cont2 {
      flex: 1 1 auto;
      min-width: 0;
      text-align: left;
      background: var(--yellow);
      color: #000;
      border-color: var(--yellow);
      border-width: 5px;
      padding: 6px 16px;
      font-size: clamp(26px, 3.2vw, 38px);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 0;
      width: auto;
    }
    .btn-cont2 .ep { font-size: 0.8em; margin-left: 0.4em; }
    .btn-hist2 {
      flex: 0 0 auto;
      border-width: 5px;
      padding: 6px 18px;
      font-size: clamp(26px, 3.2vw, 38px);
      line-height: 1.25;
      white-space: nowrap;
    }
    .grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .card2 {
      text-align: left;
      padding: 8px 8px 8px 10px;
      border-width: 5px;
      border-radius: 14px;
      background: var(--card);
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }
    .card2:hover, .card2:focus-visible { background: var(--yellow); color: #000; }
    .card2:hover .meta2, .card2:focus-visible .meta2 { color: #000; }
    .card2 .name2 {
      display: block;
      font-size: clamp(32px, 4.7vw, 56px);
      line-height: 1.2;
      white-space: nowrap;
    }
    .card2 .meta2 {
      display: block;
      font-size: clamp(22px, 2.9vw, 34px);
      color: var(--yellow);
      line-height: 1.3;
      margin-top: 8px;
    }
    .card2 .meta2 .st { color: var(--white); }
    .card2:hover .meta2 .st, .card2:focus-visible .meta2 .st { color: #000; }
    .card2.empty { visibility: hidden; }
    .pager {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
      flex: 0 0 auto;
    }
    .pager button {
      flex: 0 0 auto;
      min-width: 170px;
      border-width: 5px;
      padding: 4px 20px;
      font-size: clamp(26px, 3.2vw, 38px);
      line-height: 1.25;
    }
    .pager .pg-text {
      flex: 1 1 auto;
      text-align: center;
      font-size: clamp(24px, 3vw, 36px);
    }
    .home2 .auth-bar { margin-top: 16px; }

    /* 播放頁：置中、最寬 1100px；標題列與按鈕一定看得到，影片用剩下的高度 */
    .player-page {
      height: 100vh;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 12px 20px 16px;
      gap: 12px;
      overflow: hidden;
    }
    .player-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-home {
      flex: 0 0 auto;
      font-size: 38px;
      line-height: 1.2;
      padding: 6px 18px;
      border-width: 4px;
      border-radius: 12px;
      background: var(--card);
      color: var(--white);
    }
    .player-title {
      flex: 1 1 auto;
      min-width: 0;
      text-align: center;
      line-height: 1.2;
    }
    .player-head .sname {
      display: inline;
      font-size: clamp(28px, 3.4vw, 44px);
      color: var(--yellow);
    }
    .player-head .ep {
      display: inline;
      font-size: clamp(26px, 3vw, 40px);
      color: var(--white);
      margin-left: 0.6em;
    }
    .yt-area {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      container-type: size;
    }
    .yt-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      width: min(100cqw, calc(100cqh * 16 / 9));
      max-width: 100%;
      max-height: 100%;
      background: #111;
      border: 4px solid #333;
      border-radius: 12px;
      overflow: hidden;
    }
    .yt-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 36px;
      color: #ccc;
      z-index: 0;
    }
    #yt-player, .yt-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .yt-cover {
      display: none;
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 2;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      font-size: 48px;
      color: var(--yellow);
    }
    .yt-cover.on { display: flex; }
    /* 透明保護層：擋住 YouTube 的標題、標誌、更多影片，點一下只會播放或暫停 */
    .yt-shield {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: transparent;
      cursor: pointer;
    }
    .play-status {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .play-status.on { opacity: 1; transition: none; }
    .play-status span {
      font-size: clamp(40px, 6vw, 80px);
      line-height: 1.2;
      color: var(--yellow);
      background: rgba(0, 0, 0, 0.82);
      border: 6px solid var(--yellow);
      border-radius: var(--radius);
      padding: 0.3em 0.7em;
      white-space: nowrap;
    }
    .play-status.announce span {
      white-space: normal;
      max-width: 92%;
      text-align: center;
      font-size: clamp(32px, 4.5vw, 64px);
    }
    /* 進度條：只看不能點 */
    .progress-row {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 18px;
      pointer-events: none;
      user-select: none;
    }
    .progress-bar {
      flex: 1 1 auto;
      height: 22px;
      background: #3a3a3a;
      border: 3px solid var(--white);
      border-radius: 14px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--yellow);
    }
    .progress-text {
      flex: 0 0 auto;
      font-size: clamp(28px, 3.4vw, 40px);
      line-height: 1.1;
      color: var(--white);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .home-tools { margin-top: 56px; }
    .home-tools + .auth-bar { margin-top: 20px; }
    .btn-history {
      font-size: 28px;
      padding: 10px 22px;
      border-width: 4px;
      border-radius: 12px;
      background: var(--card);
      color: var(--white);
    }
    /* 觀看記錄頁：給家人看的，一般網頁比例 */
    .hist-page {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 20px 40px;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: #eee;
    }
    .hist-page button {
      font-size: 14px;
      font-weight: 400;
      border: 1px solid #888;
      border-radius: 6px;
      padding: 4px 12px;
      background: #222;
      color: #fff;
    }
    .hist-page button:hover { background: #333; }
    .hist-page button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
    .hist-top { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
    .hist-home { color: var(--yellow); font-size: 16px; text-decoration: underline; }
    .hist-page h2 { font-size: 22px; font-weight: 700; color: #fff; margin: 4px 0 4px; }
    .hist-note { font-size: 14px; color: #bbb; margin-bottom: 12px; }
    .hist-empty { font-size: 16px; color: #ddd; padding: 24px 0; }
    .hist-table { width: 100%; border-collapse: collapse; font-size: 15px; }
    .hist-table th, .hist-table td {
      text-align: left;
      padding: 7px 10px;
      border-bottom: 1px solid #333;
      white-space: nowrap;
    }
    .hist-table th { color: #aaa; font-weight: 700; font-size: 13px; background: #111; }
    .hist-table tbody tr { cursor: pointer; }
    .hist-table tbody tr:hover { background: #1c1c1c; }
    .hist-table td.title { white-space: normal; color: #fff; font-weight: 700; }
    .hist-done { color: #8fd18f; }
    .hist-half { color: var(--yellow); }
    .controls {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
    }
    .controls button {
      flex: 1 1 0;
      min-width: 0;
      min-height: 84px;
      font-size: clamp(26px, 3.5vw, 40px);
      line-height: 1.2;
      padding: 10px 8px;
      white-space: nowrap;
    }
    .btn-play {
      background: var(--yellow);
      color: #000;
      border-color: var(--yellow);
    }
    .seek-flash {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.35);
    }
    .seek-flash.on { display: flex; }
    .seek-flash span {
      font-size: 88px;
      line-height: 1.2;
      color: var(--yellow);
      background: rgba(0, 0, 0, 0.88);
      border: 8px solid var(--yellow);
      border-radius: var(--radius);
      padding: 36px 56px;
      text-align: center;
    }
    .finished {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 28px;
      text-align: center;
    }
    .finished p {
      font-size: 64px;
      color: var(--yellow);
    }
    .finished button {
      font-size: 56px;
      min-height: 130px;
      min-width: 70%;
      max-width: 800px;
      background: var(--yellow);
      color: #000;
      padding: 24px 40px;
    }
    .auth-bar {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 2px solid #444;
      font-size: 28px;
      color: #ddd;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
    }
    .auth-name { font-size: 28px; color: #ddd; line-height: 1.3; }
    .auth-note { font-size: 28px; color: #ddd; line-height: 1.3; }
    .btn-login {
      font-size: 28px;
      padding: 10px 22px;
      border-width: 4px;
      border-radius: 12px;
      background: var(--card);
      color: var(--white);
    }
    .btn-logout {
      font-size: 26px;
      padding: 4px 8px;
      border: 0;
      background: transparent;
      color: #ddd;
      text-decoration: underline;
    }
    @media (max-width: 800px) {
      h1 { font-size: 52px; }
      .btn-continue .big { font-size: 48px; }
      .series-card .name { font-size: 44px; }
      .seek-flash span { font-size: 64px; padding: 28px 36px; }
    }
  </style>
</head>

  const STORAGE_KEY = "yunjuan-stories-v1";

  window.onYouTubeIframeAPIReady = function () {
    ytApiReady = true;
    document.dispatchEvent(new Event("yt-api-ready"));
  };

  function $(id) { return document.getElementById(id); }

  function loadStore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (s && typeof s === "object") {
        s.series = s.series || {};
        s.history = Array.isArray(s.history) ? s.history : [];
        return s;
      }
    } catch (e) {}
    return { lastId: null, series: {}, history: [], lastBackupDate: null };
  }

  function saveStore(s) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    scheduleCloudWrite();
  }

  function getProgress(id) {
    return loadStore().series[id] || null;
  }

  function setProgress(id, patch) {
    const s = loadStore();
    const prev = s.series[id] || { index: 0, seconds: 0, finished: false };
    const next = {
      index: prev.index,
      seconds: prev.seconds,
      finished: prev.finished,
      updatedAt: prev.updatedAt || 0
    };
    Object.keys(patch).forEach(function (k) { next[k] = patch[k]; });
    next.updatedAt = Date.now();
    s.series[id] = next;
    s.lastId = id;
    saveStore(s);
  }

  function pad2(n) { return String(n).padStart(2, "0"); }

  function localNow() {
    const d = new Date();
    return {
      date: d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()),
      time: pad2(d.getHours()) + ":" + pad2(d.getMinutes()),
      ts: d.getTime()
    };
  }

  function getCurrentSeconds() {
    if (!ytPlayer) return 0;
    try {
      const t = ytPlayer.getCurrentTime();
      if (typeof t === "number" && !isNaN(t)) return Math.max(0, Math.floor(t));
    } catch (e) {}
    return 0;
  }

  function appendHistory(override) {
    override = override || {};
    const now = localNow();
    let seriesId = override.seriesId;
    let seriesName = override.seriesName;
    let episode = override.episode;
    let videoId = override.videoId;
    let seconds = override.seconds;
    if (playCtx) {
      if (!seriesId) seriesId = playCtx.series.id;
      if (!seriesName) seriesName = playCtx.series.name;
      if (episode == null) episode = playCtx.index + 1;
      if (!videoId) videoId = playCtx.series.videos[playCtx.index];
      if (seconds == null) seconds = getCurrentSeconds();
    }
    if (!seriesId) return null;
    if (seconds == null) seconds = 0;
    const rec = {
      date: now.date,
      time: now.time,
      seriesId: seriesId,
      seriesName: seriesName || seriesId,
      episode: episode || 1,
      seconds: Math.max(0, Math.floor(seconds)),
      videoId: videoId || ""
    };
    const s = loadStore();
    s.history = s.history || [];
    s.history.push(rec);
    if (s.history.length > HISTORY_MAX) s.history = s.history.slice(-HISTORY_MAX);
    saveStore(s);
    return rec;
  }

  function historyKey(h) {
    if (!h) return "";
    return [h.date, h.time, h.seriesId, h.episode, h.seconds, h.videoId].join("|");
  }

  function dedupeHistory(list) {
    const seen = {};
    const out = [];
    (list || []).forEach(function (h) {
      const k = historyKey(h);
      if (!k || seen[k]) return;
      seen[k] = true;
      out.push(h);
    });
    return out;
  }

  function mergeStores(local, cloud) {
    local = local || {};
    cloud = cloud || {};
    const out = {
      lastId: local.lastId || null,
      series: {},
      history: (local.history || []).slice(),
      lastBackupDate: local.lastBackupDate || null
    };
    const localSeries = local.series || {};
    Object.keys(localSeries).forEach(function (id) {
      const cur = localSeries[id];
      if (!cur || typeof cur !== "object") return;
      out.series[id] = {
        index: cur.index || 0,
        seconds: cur.seconds || 0,
        finished: !!cur.finished,
        updatedAt: cur.updatedAt || 0
      };
    });
    const incoming = cloud.series || {};
    Object.keys(incoming).forEach(function (id) {
      const inc = incoming[id];
      if (!inc || typeof inc !== "object") return;
      const cur = out.series[id];
      const incT = Number(inc.updatedAt) || 0;
      const curT = cur ? (Number(cur.updatedAt) || 0) : -1;
      if (!cur || incT >= curT) {
        out.series[id] = {
          index: inc.index || 0,
          seconds: inc.seconds || 0,
          finished: !!inc.finished,
          updatedAt: inc.updatedAt || 0
        };
      }
    });
    if (Array.isArray(cloud.history) && cloud.history.length) {
      out.history = dedupeHistory((out.history || []).concat(cloud.history));
      if (out.history.length > HISTORY_MAX) out.history = out.history.slice(-HISTORY_MAX);
    }
    if (cloud.lastId) {
      const incLast = incoming[cloud.lastId];
      const curLast = out.lastId ? out.series[out.lastId] : null;
      const incT = incLast ? (Number(incLast.updatedAt) || 0) : 0;
      const curT = curLast ? (Number(curLast.updatedAt) || 0) : -1;
      if (!out.lastId || incT >= curT) out.lastId = cloud.lastId;
    }
    return out;
  }

  function cloudDocFromStore(store) {
    store = store || loadStore();
    return {
      series: store.series || {},
      history: store.history || [],
      lastId: store.lastId || null,
      updatedAt: Date.now()
    };
  }

  function scheduleCloudWrite() {
    try {
      if (!cloudUser || !cloudApi) return;
      if (cloudWriteTimer) return;
      cloudWriteTimer = setTimeout(function () {
        cloudWriteTimer = null;
        writeCloudNow();
      }, CLOUD_WRITE_MS);
    } catch (e) { console.log(e); }
  }

  function flushCloudWrite() {
    try {
      if (cloudWriteTimer) {
        clearTimeout(cloudWriteTimer);
        cloudWriteTimer = null;
      }
      return writeCloudNow();
    } catch (e) {
      console.log(e);
      return Promise.resolve();
    }
  }

  function writeCloudNow() {
    try {
      if (!cloudUser || !cloudApi) return Promise.resolve();
      if (cloudWriteInFlight) {
        cloudWriteQueued = true;
        return cloudWriteInFlight;
      }
      const payload = cloudDocFromStore(loadStore());
      const uid = cloudUser.uid;
      cloudWriteInFlight = Promise.resolve(cloudApi.writeUserDoc(uid, payload)).then(function () {
        cloudWriteInFlight = null;
        if (cloudWriteQueued) {
          cloudWriteQueued = false;
          return writeCloudNow();
        }
      }).catch(function (e) {
        cloudWriteInFlight = null;
        console.log(e);
      });
      return cloudWriteInFlight;
    } catch (e) {
      console.log(e);
      cloudWriteInFlight = null;
      return Promise.resolve();
    }
  }

  function refreshHomeIfVisible() {
    try {
      const pg = parseRoute().page;
      if (pg === "home" && $("home")) renderHome();
      else if (pg === "history" && $("hist-page")) renderHistory();
    } catch (e) { console.log(e); }
  }

  function mergeFromCloud() {
    if (!cloudUser || !cloudApi) return Promise.resolve();
    return Promise.resolve(cloudApi.readUserDoc(cloudUser.uid)).then(function (data) {
      const merged = mergeStores(loadStore(), data || {});
      const s = loadStore();
      s.series = merged.series;
      s.history = merged.history;
      s.lastId = merged.lastId;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) { console.log(e); }
      return flushCloudWrite();
    }).then(function () {
      refreshHomeIfVisible();
    }).catch(function (e) {
      console.log(e);
    });
  }

  function onCloudUser(user) {
    try {
      cloudUser = user || null;
      if (cloudUser) {
        mergeFromCloud().catch(function (e) { console.log(e); });
      } else {
        refreshHomeIfVisible();
      }
    } catch (e) { console.log(e); }
  }

  function signInWithGoogle() {
    try {
      if (!cloudApi) {
        console.log("Firebase 尚未載入");
        return;
      }
      const provider = new cloudApi.GoogleAuthProvider();
      Promise.resolve(cloudApi.signInPopup(provider)).catch(function (e) {
        const code = (e && e.code) || "";
        if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
          return Promise.resolve(cloudApi.signInRedirect(provider));
        }
        console.log(e);
      }).catch(function (e) { console.log(e); });
    } catch (e) { console.log(e); }
  }

  function signOutGoogle() {
    try {
      if (!cloudApi) return;
      Promise.resolve(cloudApi.signOut()).catch(function (e) { console.log(e); });
    } catch (e) { console.log(e); }
  }

  function attachFirebase(api) {
    try {
      cloudApi = api;
      Promise.resolve(api.getRedirectResult()).catch(function (e) { console.log(e); }).then(function () {
        api.onAuthStateChanged(onCloudUser);
      }).catch(function (e) { console.log(e); });
    } catch (e) { console.log(e); }

  function findSeries(id) {
    return DATA.find(function (x) { return x.id === id; }) || null;

  function parseRoute() {
    const h = (location.hash || "").replace(/^#/, "");
    const m = h.match(/^\/?play\/([^/]+)\/(\d+)\/?$/);
    if (m) return { page: "play", id: decodeURIComponent(m[1]), index: parseInt(m[2], 10) };
    if (/^\/?history\/?$/.test(h)) return { page: "history" };
    return { page: "home" };
  }

  function goHome() {
    location.hash = "#/";

  function goPlay(id, index) {

  function progressLabel(id, count) {
    const p = getProgress(id);
    if (!p) return "還沒聽過";
    if (p.finished) return "已經聽完了";
    const n = Math.min((p.index || 0) + 1, count);
    return "上次聽到第 " + n + " 集";
  }

  function recentSeriesWithProgress(store, limit) {
    const items = [];
    const map = (store && store.series) || {};
    Object.keys(map).forEach(function (id) {
      const series = findSeries(id);
      if (!series) return;
      const p = map[id];
      if (!p) return;
      items.push({
        series: series,
        progress: p,
        updatedAt: Number(p.updatedAt) || 0
      });
    });
    items.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
    return items.slice(0, limit || 3);
  }

      index = Math.max(0, Math.min(p.index || 0, s.videos.length - 1));

    pendingRewind = (rewind && p && !p.finished) ? { id: id, index: index } : null;
    goPlay(id, index);
  }

  function whenYtReady(fn) {
    if ((window.YT && YT.Player) || ytApiReady) {
      fn();
      return;
    }
    document.addEventListener("yt-api-ready", fn, { once: true });
  }

  function createOrLoadPlayer(videoId, startSeconds) {
    ignoreEnded = true;
    whenYtReady(function () {
      if (!playCtx || !$("yt-player") && !ytPlayer) return;
      if (ytPlayer && typeof ytPlayer.loadVideoById === "function") {
        uncoverPlayer();
        ytPlayer.loadVideoById({
          videoId: videoId,
          startSeconds: startSeconds || 0
        });
        setTimeout(function () { ignoreEnded = false; }, 800);
        return;
      }
      if (!$("yt-player")) return;
      ytPlayer = new YT.Player("yt-player", {
        width: "100%",
        height: "100%",
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          controls: 0,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          disablekb: 1,
          iv_load_policy: 3,
          fs: 0,
          origin: location.origin,
          start: Math.floor(startSeconds || 0),
          enablejsapi: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    });
  }

  function onPlayerReady(e) {
    ignoreEnded = false;
    try {
      const p = playCtx && getProgress(playCtx.series.id);
      const start = p && p.index === playCtx.index ? (p.seconds || 0) : 0;
      if (start >= 15) {
        e.target.seekTo(start, true);
      }
      e.target.playVideo();
    } catch (err) {}
    startSaveLoop();
    syncToggleLabel();
  }

  function onPlayerStateChange(e) {
    syncToggleLabel();
    if (!window.YT) return;
    const st = e.data;
    if (st === YT.PlayerState.ENDED) {
      if (ignoreEnded) {
        lastYtState = st;
        return;
      }
      ignoreEnded = true;
      coverPlayer("");
      saveCurrentSeconds();
      appendHistory();
      changeEpisode(1, "ended");
    } else if (st === YT.PlayerState.PLAYING) {
      showStatus(true);
      uncoverPlayer();
      ignoreEnded = false;
      if (lastYtState !== YT.PlayerState.PLAYING && lastYtState !== YT.PlayerState.BUFFERING) {
        appendHistory();
      }
      startHistoryLoop();
    } else if (st === YT.PlayerState.PAUSED) {
      showStatus(false);
      saveCurrentSeconds();
      appendHistory();
    }
    lastYtState = st;
  }

  function onPlayerError() {
    const ph = $("yt-placeholder");
    if (ph) ph.textContent = "這集暫時不能播放，請按下一集";

  function syncToggleLabel() {
    const btn = $("btn-toggle");
    if (!btn) return;
    let playing = false;
    try {
      if (ytPlayer && window.YT && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {

  function returnFocusToPage() {
    try {
      const iframe = document.querySelector(".yt-wrap iframe, #yt-player iframe, iframe");
      if (iframe && iframe.blur) iframe.blur();
    } catch (e) {}
    try {
      if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) {
        document.activeElement.blur();
      }
    } catch (e) {}
    try { window.focus(); } catch (e) {}
    try { document.body.focus(); } catch (e) {}

  function fmtClock(sec, withHours) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const ss = sec % 60;
    if (withHours) return h + ":" + pad2(m) + ":" + pad2(ss);
    return (h * 60 + m) + ":" + pad2(ss);
  }

  // 播放進度（只顯示，不能點）
  function updateProgress() {
    const text = $("progress-text");
    const fill = $("progress-fill");
    if (!text || !fill) return;
    let cur = 0;
    let dur = 0;
    try {
      if (ytPlayer) {
        const t = ytPlayer.getCurrentTime();
        if (typeof t === "number" && !isNaN(t)) cur = t;
        const d = ytPlayer.getDuration();
        if (typeof d === "number" && !isNaN(d) && d > 0) dur = d;
      }
    } catch (e) {}
    if (dur > 0 && cur > dur) cur = dur;
    const longVideo = dur >= 3600;
    text.textContent = fmtClock(cur, longVideo) + " / " + fmtClock(dur, longVideo);
    fill.style.width = (dur > 0 ? Math.min(100, (cur / dur) * 100) : 0) + "%";
  }

  function startProgressLoop() {
    clearInterval(progTimer);
    updateProgress();
    progTimer = setInterval(updateProgress, 1000);
  }

  function fmtTaipei(ts) {
    ts = Number(ts) || 0;
    if (!ts) return "—";
    try {
      const parts = {};
      new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hour12: false
      }).formatToParts(new Date(ts)).forEach(function (x) { parts[x.type] = x.value; });
      return parts.year + "/" + parts.month + "/" + parts.day + " " + (parts.hour === "24" ? "00" : parts.hour) + ":" + parts.minute;
    } catch (e) {
      const d = new Date(ts);
      return d.getFullYear() + "/" + pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }
  }

    top.appendChild(home);
    pageEl.appendChild(top);

    const h2 = document.createElement("h2");
    h2.textContent = "觀看記錄";
    pageEl.appendChild(h2);
    const note = document.createElement("div");
    note.className = "hist-note";
    note.id = "hist-note";
    note.textContent = cloudUser
      ? "已登入：" + (cloudUser.displayName || cloudUser.email || "Google 帳號") + "，記錄已和雲端同步"
      : "沒登入，只顯示這台電腦的記錄";
    pageEl.appendChild(note);

    const rows = recentSeriesWithProgress(loadStore(), 1000);
    if (!rows.length) {
      const empty = document.createElement("div");
      empty.className = "hist-empty";
      empty.id = "hist-empty";
      empty.textContent = "還沒有觀看記錄";
      pageEl.appendChild(empty);
    } else {
      const table = document.createElement("table");
      table.className = "hist-table";
      table.id = "hist-table";
      const thead = document.createElement("thead");
      const hr = document.createElement("tr");
      ["故事", "聽到第幾集", "這集聽到", "最後收聽（台北時間）", "狀態", ""].forEach(function (t) {
        const th = document.createElement("th");
        th.textContent = t;
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);
      const tbody = document.createElement("tbody");
      rows.forEach(function (item) {
        const s = item.series;
        const pr = item.progress || {};
        const total = s.videos.length;
        const n = Math.min((pr.index || 0) + 1, total);
        const tr = document.createElement("tr");
        tr.setAttribute("data-id", s.id);
        const cells = [
          s.name,
          "第 " + n + " 集 / 共 " + total + " 集",
          pr.finished ? "—" : fmtClock(pr.seconds || 0, (pr.seconds || 0) >= 3600),
          fmtTaipei(pr.updatedAt),
          pr.finished ? "已聽完" : "聽到一半"
        ];
        cells.forEach(function (c, i) {
          const td = document.createElement("td");
          td.textContent = c;
          if (i === 0) td.className = "title";
          if (i === 4) td.className = pr.finished ? "hist-done" : "hist-half";
          tr.appendChild(td);
        });
        const tdBtn = document.createElement("td");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "hist-resume";
        b.textContent = pr.finished ? "再聽一次" : "接著聽";
        tdBtn.appendChild(b);
        tr.appendChild(tdBtn);
        tr.addEventListener("click", function () { startSeries(s.id, true); });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      pageEl.appendChild(table);
    }
    root.appendChild(pageEl);
  }

  // 影片中間的大字狀態：播放中顯示 2.5 秒後淡出；暫停時一直顯示
  // 大字公告（例如數字鍵盤 Enter 換故事），約 2.5 秒；期間不被播放／暫停大字蓋掉
  function showAnnounce(text) {
    const el = $("play-status");
    if (!el) return;
    const span = el.querySelector("span");
    if (span) span.textContent = text;
    el.classList.add("announce");
    el.setAttribute("data-state", "announce");
    el.classList.add("on");
    clearTimeout(statusTimer);
    statusTimer = null;
    clearTimeout(announceTimer);
    announceUntil = Date.now() + 2500;
    announceTimer = setTimeout(function () {
      announceUntil = 0;
      el.classList.remove("on");
      el.classList.remove("announce");
    }, 2500);
  }

  // 數字鍵盤 Enter：隨機換一個「還沒聽過」的故事，從第 1 集 0 秒開始；
  // 全部都聽過時，隨機挑別的故事，從它存的位置接著聽（不重設進度）
  function switchToRandomSeries() {
    if (!playCtx || !$("player-page")) return;
    const curId = playCtx.series.id;
    const others = DATA.filter(function (x) { return x.id !== curId; });
    if (!others.length) return;
    saveCurrentSeconds();
    appendHistory();
    flushCloudWrite();
    const store = loadStore();
    const heard = {};
    Object.keys(store.series || {}).forEach(function (id) { heard[id] = true; });
    (store.history || []).forEach(function (h) { if (h && h.seriesId) heard[h.seriesId] = true; });
    const unheard = others.filter(function (x) { return !heard[x.id]; });
    const fresh = unheard.length > 0;
    const pool = fresh ? unheard : others;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    let index = 0;
    if (!fresh) {
      const p = store.series[pick.id];
      if (p && !p.finished) index = Math.max(0, Math.min(p.index || 0, pick.videos.length - 1));
    }
    teardownPlayer();
    pendingRewind = null;
    pendingFresh = { id: pick.id, text: "換一個故事：" + pick.name, fresh: fresh };
    goPlay(pick.id, index);
  }
  window.__switchToRandomSeries = switchToRandomSeries;

  function showStatus(playing) {
    if (Date.now() < announceUntil) return;
    const el = $("play-status");
    if (!el) return;
    const span = el.querySelector("span");
    if (span) span.textContent = playing ? "▶ 正在播放" : "❚❚ 已暫停";
    el.setAttribute("data-state", playing ? "playing" : "paused");
    el.classList.add("on");
    clearTimeout(statusTimer);
    statusTimer = null;
    if (playing) {
      statusTimer = setTimeout(function () { el.classList.remove("on"); }, 2500);
    }
  }

  // 系列最後一集聽完時的提示音（WebAudio，不用外部檔案）
  function playBeep() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended" && audioCtx.resume) audioCtx.resume();
      const t0 = audioCtx.currentTime + 0.05;
      [0, 0.45].forEach(function (offset, i) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = i === 0 ? 880 : 660;
        gain.gain.setValueAtTime(0.0001, t0 + offset);
        gain.gain.exponentialRampToValueAtTime(0.4, t0 + offset + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + offset + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0 + offset);
        osc.stop(t0 + offset + 0.42);
      });
      window.__beepCount = (window.__beepCount || 0) + 1;
    } catch (e) { console.log(e); }
  }

  function seekBy(delta) {
    if (!playCtx || !ytPlayer) return;
    try {
      const t = ytPlayer.getCurrentTime();
      const cur = (typeof t === "number" && !isNaN(t)) ? t : 0;
      let dur = 0;
      try {
        const d = ytPlayer.getDuration();
        if (typeof d === "number" && !isNaN(d) && d > 0) dur = d;
      } catch (err) {}
      let next = cur + delta;
      if (next < 0) next = 0;
      if (dur > 0 && next > dur) next = dur;
      ytPlayer.seekTo(next, true);
      setProgress(playCtx.series.id, {
        index: playCtx.index,
        seconds: Math.max(0, Math.floor(next)),
        finished: false
      });
    } catch (e) {}
  }

  function togglePlay() {
    if (!ytPlayer) return;
    let label = "";
    try {
      const st = ytPlayer.getPlayerState();
      if (window.YT && st === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
        label = "pause";
      } else {
        uncoverPlayer();
        ytPlayer.playVideo();
        label = "play";
      }
    } catch (e) {}
    if (label) showStatus(label === "play");
    returnFocusToPage();
    setTimeout(syncToggleLabel, 200);
  }

  function saveCurrentSeconds() {
    if (!playCtx || !ytPlayer) return;
    try {
      const t = ytPlayer.getCurrentTime();
      if (typeof t === "number" && !isNaN(t)) {
        setProgress(playCtx.series.id, {
          index: playCtx.index,
          seconds: Math.max(0, Math.floor(t)),
          finished: false
        });
      }
    } catch (e) {}
  }

  function startSaveLoop() {
    clearInterval(saveTimer);
    saveTimer = setInterval(saveCurrentSeconds, 5000);
  }

  function startHistoryLoop() {
    if (histTimer) return;
    histTimer = setInterval(function () {
      if (!playCtx || !ytPlayer) return;
      try {
        if (window.YT && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
          saveCurrentSeconds();
          appendHistory();
        }
      } catch (e) {}
    }, 60000);
  }

  function changeEpisode(delta, reason) {
    if (!playCtx) return;
    saveCurrentSeconds();
    if (reason !== "ended") appendHistory();
    const next = playCtx.index + delta;
    const series = playCtx.series;
    if (next < 0) return;
    if (next >= series.videos.length) {
      setProgress(series.id, { index: series.videos.length - 1, seconds: 0, finished: true });
      if (reason === "ended") flushCloudWrite();
      renderFinished(series.name);
      return;
    }
    const samePage = $("player-page");
    playCtx.index = next;
    setProgress(series.id, { index: next, seconds: 0, finished: false });
    if (samePage) {
      if (location.hash !== "#/play/" + encodeURIComponent(series.id) + "/" + next) {
        history.replaceState(null, "", "#/play/" + encodeURIComponent(series.id) + "/" + next);
      }
      updatePlayerChrome();
      createOrLoadPlayer(series.videos[next], 0);
    } else {
      goPlay(series.id, next);
    }
    if (reason === "ended") flushCloudWrite();
  }

  function teardownPlayer() {
    clearInterval(saveTimer);
    saveTimer = null;
    clearInterval(histTimer);
    histTimer = null;
    lastYtState = null;
    clearTimeout(flashTimer);
    flashTimer = null;
    clearTimeout(statusTimer);
    statusTimer = null;
    clearInterval(progTimer);
    progTimer = null;
    clearTimeout(announceTimer);
    announceTimer = null;
    announceUntil = 0;
    const flash = $("seek-flash");
    if (flash) flash.classList.remove("on");
    clearTimeout(finishedTimer);
    finishedTimer = null;
    ignoreEnded = true;
    if (ytPlayer) {
      try { ytPlayer.stopVideo(); } catch (e) {}
      try { ytPlayer.destroy(); } catch (e) {}
      ytPlayer = null;
    }
    playCtx = null;
  }

  function route() {
    const r = parseRoute();
    if (r.page === "play") {
      if (playCtx && playCtx.series.id === r.id && playCtx.index === r.index && $("player-page")) {
        return;
      }
      renderPlayer(r.id, r.index);
    } else {
      if (playCtx) {
        saveCurrentSeconds();
        flushCloudWrite();
      }
      if (r.page === "history") renderHistory();
      else renderHome();
    }
  }

  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    const r = parseRoute();
    if (r.page === "play") {
      if (e.code === "NumpadEnter") {
        if ($("player-page")) {
          e.preventDefault();
          switchToRandomSeries();
        }
        return;
      }
      if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        if ($("app").querySelector(".finished")) {
          goHome();
          return;
        }
        togglePlay();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        if ($("app").querySelector(".finished")) return;
        seekBy(-SEEK_STEP);
        showFlash("倒退 30 秒");
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        if ($("app").querySelector(".finished")) return;
        seekBy(SEEK_STEP);
        showFlash("快轉 30 秒");
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if ($("app").querySelector(".finished")) return;
        if (!playCtx || playCtx.index <= 0) return;
        changeEpisode(-1);
        showFlash("上一集");
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if ($("app").querySelector(".finished")) return;
        if (!playCtx) return;
        changeEpisode(1);
        showFlash("下一集");
      }
      return;
    }
    const cards = Array.prototype.slice.call(document.querySelectorAll(".btn-continue, .series-card"));
    if (!cards.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const i = cards.indexOf(document.activeElement);
      const start = i < 0 ? (e.key === "ArrowDown" ? -1 : 0) : i;
      const next = e.key === "ArrowDown"
        ? Math.min(start + 1, cards.length - 1)
        : Math.max(start - 1, 0);
      cards[next].focus();
    }
  });

  function onLeavePage() {
    saveCurrentSeconds();
    flushCloudWrite();
  }
  window.addEventListener("hashchange", route);
  window.addEventListener("beforeunload", onLeavePage);
  window.addEventListener("pagehide", onLeavePage);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) onLeavePage();
  });

  route();
  </script>
