<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雲卷雲書 說故事</title>
  <style>
    :root {
      --bg: #000000;
      --card: #161616;
      --yellow: #FFD400;
      --white: #FFFFFF;
      --disabled-bg: #2a2a2a;
      --disabled-fg: #9a9a9a;
      --gap: 28px;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--white);
      font-family: "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei",
                   "PingFang TC", "Heiti TC", "Source Han Sans TC", sans-serif;
      font-weight: 700;
      font-size: 40px;
      line-height: 1.35;
      min-height: 100%;
    }
    body { min-height: 100vh; }
    button {
      font: inherit;
      font-weight: 700;
      color: inherit;
      cursor: pointer;
      border: 6px solid var(--yellow);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--white);
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible, a:focus-visible {
      outline: 8px solid var(--white);
      outline-offset: 4px;
    }
    button:disabled {
      background: var(--disabled-bg);
      color: var(--disabled-fg);
      border-color: #555;
      cursor: default;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 28px 80px;
    }
    h1 {
      font-size: 64px;
      line-height: 1.2;
      color: var(--yellow);
      margin-bottom: 12px;
    }
    .hint {
      font-size: 40px;
      color: var(--white);
      margin-bottom: 32px;
    }
    #continue-wrap { margin-bottom: 40px; }
    #continue-wrap[hidden] { display: none; }
    .btn-continue {
      width: 100%;
      text-align: left;
      background: var(--yellow);
      color: #000;
      border-color: var(--yellow);
      padding: 32px 36px;
      min-height: 150px;
    }
    .btn-continue .big { font-size: 56px; display: block; margin-bottom: 10px; }
    .btn-continue .sub { font-size: 40px; display: block; }
    .btn-continue:hover, .btn-continue:focus-visible { filter: brightness(1.08); }
    .series-list {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }
    .series-card {
      width: 100%;
      text-align: left;
      padding: 32px 36px;
      min-height: 180px;
      background: var(--card);
      border: 6px solid var(--yellow);
    }
    .series-card:hover, .series-card:focus-visible {
      background: var(--yellow);
      color: #000;
    }
    .series-card:hover .meta, .series-card:focus-visible .meta { color: #000; }
    .series-card .name { font-size: 52px; display: block; margin-bottom: 12px; }
    .series-card .meta { font-size: 40px; color: var(--yellow); display: block; }
    .series-card .meta + .meta { margin-top: 4px; }

    /* 播放頁：標題與按鈕固定可見，影片填中間 */
    .player-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 24px;
      gap: 16px;
    }
    .player-head { flex: 0 0 auto; text-align: center; }
    .player-head .sname {
      font-size: 52px;
      color: var(--yellow);
      line-height: 1.2;
    }
    .player-head .ep {
      font-size: 48px;
      color: var(--white);
      margin-top: 6px;
    }
    .yt-wrap {
      flex: 1 1 auto;
      position: relative;
      background: #111;
      border: 4px solid #333;
      border-radius: 12px;
      min-height: 220px;
      max-height: calc(100vh - 420px);
      overflow: hidden;
    }
    .yt-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 40px;
      color: #ccc;
      z-index: 0;
    }
    #yt-player, .yt-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .yt-cover {
      display: none;
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 2;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      font-size: 56px;
      color: var(--yellow);
    }
    .yt-cover.on { display: flex; }
    .controls {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }
    .controls button {
      min-height: 110px;
      font-size: 48px;
      padding: 16px 12px;
    }
    .btn-play {
      background: var(--yellow);
      color: #000;
      border-color: var(--yellow);
    }
    .btn-home {
      grid-column: 1 / -1;
      background: var(--card);
      color: var(--white);
    }
    .finished {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 28px;
      text-align: center;
    }
    .finished p {
      font-size: 64px;
      color: var(--yellow);
    }
    .finished button {
      font-size: 56px;
      min-height: 130px;
      min-width: 70%;
      max-width: 800px;
      background: var(--yellow);
      color: #000;
      padding: 24px 40px;
    }
    .backup-bar {
      margin-top: 64px;
      padding-top: 40px;
      border-top: 6px solid #333;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .backup-bar button {
      width: 100%;
      min-height: 120px;
      font-size: 44px;
      padding: 24px 28px;
    }
    .btn-backup-now {
      background: var(--yellow);
      color: #000;
      border-color: var(--yellow);
    }
    .btn-restore {
      background: var(--card);
      color: var(--white);
    }
    .restore-msg {
      font-size: 52px;
      color: var(--yellow);
      text-align: center;
      padding: 28px 24px;
      border: 6px solid var(--yellow);
      border-radius: var(--radius);
      margin-bottom: 32px;
    }
    .restore-msg.error {
      color: var(--white);
      border-color: #aaa;
    }
    #restore-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    @media (max-width: 800px) {
      h1 { font-size: 52px; }
      .btn-continue .big { font-size: 48px; }
      .series-card .name { font-size: 44px; }
      .player-head .sname { font-size: 44px; }
      .player-head .ep { font-size: 40px; }
      .controls { grid-template-columns: 1fr; }
      .controls button { min-height: 100px; font-size: 44px; }
      .yt-wrap { max-height: none; min-height: 40vh; }
      .backup-bar button { min-height: 110px; font-size: 40px; }
      .restore-msg { font-size: 44px; }
    }
  </style>
</head>

  window.onYouTubeIframeAPIReady = function () {
    ytApiReady = true;
    document.dispatchEvent(new Event("yt-api-ready"));
  };

  function $(id) { return document.getElementById(id); }

  function loadStore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (s && typeof s === "object") {
        s.series = s.series || {};
        s.history = Array.isArray(s.history) ? s.history : [];
        return s;
      }
    } catch (e) {}
    return { lastId: null, series: {}, history: [], lastBackupDate: null };
  }

  function saveStore(s) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  }

  function getProgress(id) {
    return loadStore().series[id] || null;
  }

  function setProgress(id, patch) {
    const s = loadStore();
    const prev = s.series[id] || { index: 0, seconds: 0, finished: false };
    const next = {
      index: prev.index,
      seconds: prev.seconds,
      finished: prev.finished,
      updatedAt: prev.updatedAt || 0
    };
    Object.keys(patch).forEach(function (k) { next[k] = patch[k]; });
    next.updatedAt = Date.now();
    s.series[id] = next;
    s.lastId = id;
    saveStore(s);
  }

  function pad2(n) { return String(n).padStart(2, "0"); }

  function localNow() {
    const d = new Date();
    return {
      date: d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()),
      time: pad2(d.getHours()) + ":" + pad2(d.getMinutes()),
      ts: d.getTime()
    };
  }

  function formatMmSs(sec) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    return Math.floor(sec / 60) + "分" + pad2(sec % 60) + "秒";
  }

  function formatLocalDateTime(ts) {
    if (ts == null || ts === "") return "";
    const d = new Date(ts);
    if (isNaN(d.getTime())) return "";
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate())
      + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function getCurrentSeconds() {
    if (!ytPlayer) return 0;
    try {
      const t = ytPlayer.getCurrentTime();
      if (typeof t === "number" && !isNaN(t)) return Math.max(0, Math.floor(t));
    } catch (e) {}
    return 0;
  }

  function appendHistory(override) {
    override = override || {};
    const now = localNow();
    let seriesId = override.seriesId;
    let seriesName = override.seriesName;
    let episode = override.episode;
    let videoId = override.videoId;
    let seconds = override.seconds;
    if (playCtx) {
      if (!seriesId) seriesId = playCtx.series.id;
      if (!seriesName) seriesName = playCtx.series.name;
      if (episode == null) episode = playCtx.index + 1;
      if (!videoId) videoId = playCtx.series.videos[playCtx.index];
      if (seconds == null) seconds = getCurrentSeconds();
    }
    if (!seriesId) return null;
    if (seconds == null) seconds = 0;
    const rec = {
      date: now.date,
      time: now.time,
      seriesId: seriesId,
      seriesName: seriesName || seriesId,
      episode: episode || 1,
      seconds: Math.max(0, Math.floor(seconds)),
      videoId: videoId || ""
    };
    const s = loadStore();
    s.history = s.history || [];
    s.history.push(rec);
    if (s.history.length > HISTORY_MAX) s.history = s.history.slice(-HISTORY_MAX);
    saveStore(s);
    return rec;
  }

  function seriesDisplayName(id, fallback) {
    const s = findSeries(id);
    return (s && s.name) || fallback || id;
  }

  function buildBackupText() {
    const store = loadStore();
    const lines = [];
    lines.push("目前進度");
    lines.push("");
    const ids = Object.keys(store.series || {});
    ids.sort(function (a, b) {
      return (store.series[b].updatedAt || 0) - (store.series[a].updatedAt || 0);
    });
    if (!ids.length) {
      lines.push("還沒有收聽進度");
    } else {
      ids.forEach(function (id) {
        const p = store.series[id] || {};
        const name = seriesDisplayName(id);
        const ep = (p.index || 0) + 1;
        const when = formatLocalDateTime(p.updatedAt);
        let line = name + " 第" + ep + "集 聽到 " + formatMmSs(p.seconds);
        if (when) line += "（最後聽的時間 " + when + "）";
        lines.push(line);
      });
    }
    lines.push("");
    lines.push("收聽紀錄");
    lines.push("");
    const hist = store.history || [];
    if (!hist.length) {
      lines.push("還沒有收聽紀錄");
    } else {
      hist.forEach(function (h) {
        lines.push(
          (h.date || "") + " " + (h.time || "") + " " + (h.seriesName || "")
          + " 第" + (h.episode || 1) + "集 " + formatMmSs(h.seconds)
        );
      });
    }
    lines.push("");
    lines.push(BACKUP_MARK);
    lines.push(JSON.stringify({
      version: 1,
      lastId: store.lastId || null,
      series: store.series || {},
      history: hist
    }));
    return lines.join("\n");
  }

  function backupFileName(dateStr) {
    return "聽故事紀錄_" + (dateStr || localNow().date) + ".txt";
  }

  function downloadBackup() {
    const text = buildBackupText();
    const filename = backupFileName();
    const blob = new Blob(["\uFEFF" + text], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(a.href);
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 1500);
    return filename;
  }

  function hasAnythingToBackup(store) {
    store = store || loadStore();
    if (store.lastId) return true;
    if (store.history && store.history.length) return true;
    if (store.series && Object.keys(store.series).length) return true;
    return false;
  }

  function maybeAutoBackup() {
    const store = loadStore();
    const today = localNow().date;
    if (store.lastBackupDate === today) return false;
    if (!hasAnythingToBackup(store)) return false;
    downloadBackup();
    const s = loadStore();
    s.lastBackupDate = today;
    saveStore(s);
    return true;
  }

  function parseRestorePayload(text) {
    text = String(text || "").replace(/^\uFEFF/, "");
    const i = text.indexOf(BACKUP_MARK);
    if (i < 0) throw new Error("missing mark");
    const data = JSON.parse(text.slice(i + BACKUP_MARK.length).trim());
    if (!data || typeof data !== "object") throw new Error("bad json");
    return data;
  }

  function mergeRestore(data) {
    const store = loadStore();
    const incoming = (data && data.series) || {};
    Object.keys(incoming).forEach(function (id) {
      const inc = incoming[id];
      if (!inc || typeof inc !== "object") return;
      const cur = store.series[id];
      const incT = Number(inc.updatedAt) || 0;
      const curT = cur ? (Number(cur.updatedAt) || 0) : -1;
      if (!cur || incT >= curT) {
        store.series[id] = {
          index: inc.index || 0,
          seconds: inc.seconds || 0,
          finished: !!inc.finished,
          updatedAt: inc.updatedAt || 0
        };
      }
    });
    if (Array.isArray(data.history) && data.history.length) {
      store.history = (store.history || []).concat(data.history);
      if (store.history.length > HISTORY_MAX) store.history = store.history.slice(-HISTORY_MAX);
    }
    if (data.lastId) {
      const incLast = incoming[data.lastId];
      const curLast = store.lastId ? store.series[store.lastId] : null;
      const incT = incLast ? (Number(incLast.updatedAt) || 0) : 0;
      const curT = curLast ? (Number(curLast.updatedAt) || 0) : -1;
      if (!store.lastId || incT >= curT) store.lastId = data.lastId;
    }
    saveStore(store);
  }

  function restoreFromText(text) {
    mergeRestore(parseRestorePayload(text));
  }

  function findSeries(id) {
    return DATA.find(function (x) { return x.id === id; }) || null;
  }

  function parseRoute() {
    const h = (location.hash || "").replace(/^#/, "");
    const m = h.match(/^\/?play\/([^/]+)\/(\d+)\/?$/);
    if (m) return { page: "play", id: decodeURIComponent(m[1]), index: parseInt(m[2], 10) };
    return { page: "home" };
  }

  function goHome() {
    location.hash = "#/";
  }

  function goPlay(id, index) {
    location.hash = "#/play/" + encodeURIComponent(id) + "/" + index;
  }

  function progressLabel(id, count) {
    const p = getProgress(id);
    if (!p) return "還沒聽過";
    if (p.finished) return "已經聽完了";
    const n = Math.min((p.index || 0) + 1, count);
    return "上次聽到第 " + n + " 集";
  }

  function renderHome() {
    teardownPlayer();
    const store = loadStore();
    const last = store.lastId ? findSeries(store.lastId) : null;

    const root = $("app");
    root.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "wrap";
    wrap.id = "home";

    const h1 = document.createElement("h1");
    h1.textContent = "雲卷雲書";
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "請點一個故事開始聽";
    wrap.appendChild(h1);
    wrap.appendChild(hint);

    if (homeNotice) {
      const msg = document.createElement("div");
      msg.className = "restore-msg" + (homeNotice.error ? " error" : "");
      msg.id = "restore-msg";
      msg.textContent = homeNotice.text;
      wrap.appendChild(msg);
    }

    const contWrap = document.createElement("div");
    contWrap.id = "continue-wrap";
    if (!last) {
      contWrap.hidden = true;
    } else {
      const lastP = getProgress(last.id);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn-continue";
      btn.id = "btn-continue";
      const big = document.createElement("span");
      big.className = "big";
      const sub = document.createElement("span");
      sub.className = "sub";
      if (lastP && lastP.finished) {
        big.textContent = "再聽一次上次的故事";
        sub.textContent = last.name + "　已經聽完了";
      } else {
        big.textContent = "繼續聽上次的故事";
        const n = lastP ? Math.min((lastP.index || 0) + 1, last.videos.length) : 1;
        sub.textContent = last.name + "　第 " + n + " 集";
      }
      btn.appendChild(big);
      btn.appendChild(sub);
      btn.addEventListener("click", function () {
        startSeries(last.id);
      });
      contWrap.appendChild(btn);
    }
    wrap.appendChild(contWrap);

    const list = document.createElement("div");
    list.className = "series-list";
    DATA.forEach(function (s) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "series-card";
      card.setAttribute("data-id", s.id);
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = s.name;
      const count = document.createElement("span");
      count.className = "meta";
      count.textContent = "共 " + s.videos.length + " 集";
      const prog = document.createElement("span");
      prog.className = "meta";
      prog.textContent = progressLabel(s.id, s.videos.length);
      card.appendChild(name);
      card.appendChild(count);
      card.appendChild(prog);
      card.addEventListener("click", function () { startSeries(s.id); });
      list.appendChild(card);
    });
    wrap.appendChild(list);

    const bar = document.createElement("div");
    bar.className = "backup-bar";
    bar.id = "backup-bar";
    const btnDl = document.createElement("button");
    btnDl.type = "button";
    btnDl.id = "btn-backup-now";
    btnDl.className = "btn-backup-now";
    btnDl.textContent = "現在下載備份";
    btnDl.addEventListener("click", function () { downloadBackup(); });
    const btnRs = document.createElement("button");
    btnRs.type = "button";
    btnRs.id = "btn-restore";
    btnRs.className = "btn-restore";
    btnRs.textContent = "從備份檔還原進度";
    const file = document.createElement("input");
    file.type = "file";
    file.id = "restore-file";
    file.accept = ".txt,text/plain";
    file.addEventListener("change", function () {
      const f = file.files && file.files[0];
      file.value = "";
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          restoreFromText(String(reader.result || ""));
          homeNotice = { text: "進度已還原", error: false };
          renderHome();
        } catch (err) {
          homeNotice = { text: "這個檔案無法還原，請再選一次", error: true };
          renderHome();
        }
      };
      reader.onerror = function () {
        homeNotice = { text: "這個檔案無法還原，請再選一次", error: true };
        renderHome();
      };
      reader.readAsText(f, "UTF-8");
    });
    btnRs.addEventListener("click", function () { file.click(); });
    bar.appendChild(btnDl);
    bar.appendChild(btnRs);
    bar.appendChild(file);
    wrap.appendChild(bar);
    root.appendChild(wrap);
  }

  function startSeries(id) {
    homeNotice = null;
    const s = findSeries(id);
    if (!s) return;
    const p = getProgress(id);
    let index = 0;
    if (p && !p.finished) {
      index = Math.max(0, Math.min(p.index || 0, s.videos.length - 1));
    }
    goPlay(id, index);
  }

  function renderFinished(name) {
    teardownPlayer();
    const root = $("app");
    root.innerHTML = "";
    const box = document.createElement("div");
    box.className = "finished";
    const p = document.createElement("p");
    p.textContent = "這個故事聽完了";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "回首頁";
    btn.addEventListener("click", function () {
      clearTimeout(finishedTimer);
      maybeAutoBackup();
      goHome();
    });
    box.appendChild(p);
    box.appendChild(btn);
    root.appendChild(box);
    clearTimeout(finishedTimer);
    finishedTimer = setTimeout(function () {
      maybeAutoBackup();
      goHome();
    }, 4000);
  }

  function renderPlayer(id, index) {
    const series = findSeries(id);
    if (!series) { goHome(); return; }
    const total = series.videos.length;
    index = Math.max(0, Math.min(index, total - 1));
    playCtx = { series: series, index: index };

    const existing = getProgress(id);
    const resumeSame = existing && !existing.finished && existing.index === index;
    const startSeconds = resumeSame ? Math.max(0, Math.floor(existing.seconds || 0)) : 0;
    setProgress(id, { index: index, finished: false, seconds: startSeconds });

    const root = $("app");
    root.innerHTML = "";
    const page = document.createElement("div");
    page.className = "player-page";
    page.id = "player-page";

    const head = document.createElement("div");
    head.className = "player-head";
    const sname = document.createElement("div");
    sname.className = "sname";
    sname.id = "player-sname";
    sname.textContent = series.name;
    const ep = document.createElement("div");
    ep.className = "ep";
    ep.id = "player-ep";
    ep.textContent = "第 " + (index + 1) + " 集 / 共 " + total + " 集";
    head.appendChild(sname);
    head.appendChild(ep);

    const yt = document.createElement("div");
    yt.className = "yt-wrap";
    yt.id = "yt-wrap";
    const ph = document.createElement("div");
    ph.className = "yt-placeholder";
    ph.id = "yt-placeholder";
    ph.textContent = "正在載入影片";
    const cover = document.createElement("div");
    cover.className = "yt-cover";
    cover.id = "yt-cover";
    const mount = document.createElement("div");
    mount.id = "yt-player";
    yt.appendChild(ph);
    yt.appendChild(mount);
    yt.appendChild(cover);

    const controls = document.createElement("div");
    controls.className = "controls";
    const btnPrev = document.createElement("button");
    btnPrev.type = "button";
    btnPrev.id = "btn-prev";
    btnPrev.textContent = "上一集";
    btnPrev.disabled = index <= 0;
    const btnToggle = document.createElement("button");
    btnToggle.type = "button";
    btnToggle.id = "btn-toggle";
    btnToggle.className = "btn-play";
    btnToggle.textContent = "播放";
    const btnNext = document.createElement("button");
    btnNext.type = "button";
    btnNext.id = "btn-next";
    btnNext.textContent = "下一集";
    btnNext.disabled = false;
    const btnHome = document.createElement("button");
    btnHome.type = "button";
    btnHome.id = "btn-home";
    btnHome.className = "btn-home";
    btnHome.textContent = "回首頁";

    btnPrev.addEventListener("click", function () { changeEpisode(-1); });
    btnNext.addEventListener("click", function () { changeEpisode(1); });
    btnToggle.addEventListener("click", togglePlay);
    btnHome.addEventListener("click", function () {
      saveCurrentSeconds();
      maybeAutoBackup();
      goHome();
    });

    controls.appendChild(btnPrev);
    controls.appendChild(btnToggle);
    controls.appendChild(btnNext);
    controls.appendChild(btnHome);

    page.appendChild(head);
    page.appendChild(yt);
    page.appendChild(controls);
    root.appendChild(page);

    createOrLoadPlayer(series.videos[index], startSeconds);
  }

  function updatePlayerChrome() {
    if (!playCtx) return;
    const { series, index } = playCtx;
    const ep = $("player-ep");
    if (ep) ep.textContent = "第 " + (index + 1) + " 集 / 共 " + series.videos.length + " 集";
    const sname = $("player-sname");
    if (sname) sname.textContent = series.name;
    const prev = $("btn-prev");
    if (prev) prev.disabled = index <= 0;
    const next = $("btn-next");
    if (next) next.disabled = false;
  }

  function coverPlayer(text) {
    const c = $("yt-cover");
    if (!c) return;
    c.textContent = text || "";
    c.classList.add("on");
  }

  function uncoverPlayer() {
    const c = $("yt-cover");
    if (!c) return;
    c.textContent = "";
    c.classList.remove("on");
  }

  function whenYtReady(fn) {
    if ((window.YT && YT.Player) || ytApiReady) {
      fn();
      return;
    }
    document.addEventListener("yt-api-ready", fn, { once: true });
  }

  function createOrLoadPlayer(videoId, startSeconds) {
    ignoreEnded = true;
    whenYtReady(function () {
      if (!playCtx || !$("yt-player") && !ytPlayer) return;
      if (ytPlayer && typeof ytPlayer.loadVideoById === "function") {
        uncoverPlayer();
        ytPlayer.loadVideoById({
          videoId: videoId,
          startSeconds: startSeconds || 0
        });
        setTimeout(function () { ignoreEnded = false; }, 800);
        return;
      }
      if (!$("yt-player")) return;
      ytPlayer = new YT.Player("yt-player", {
        width: "100%",
        height: "100%",
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          disablekb: 1,
          iv_load_policy: 3,
          fs: 1,
          origin: location.origin,
          start: Math.floor(startSeconds || 0),
          enablejsapi: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    });
  }

  function onPlayerReady(e) {
    ignoreEnded = false;
    try {
      const p = playCtx && getProgress(playCtx.series.id);
      const start = p && p.index === playCtx.index ? (p.seconds || 0) : 0;
      if (start >= 15) {
        e.target.seekTo(start, true);
      }
      e.target.playVideo();
    } catch (err) {}
    startSaveLoop();
    syncToggleLabel();
  }

  function onPlayerStateChange(e) {
    syncToggleLabel();
    if (!window.YT) return;
    const st = e.data;
    if (st === YT.PlayerState.ENDED) {
      if (ignoreEnded) {
        lastYtState = st;
        return;
      }
      ignoreEnded = true;
      coverPlayer("");
      saveCurrentSeconds();
      appendHistory();
      changeEpisode(1, "ended");
    } else if (st === YT.PlayerState.PLAYING) {
      uncoverPlayer();
      ignoreEnded = false;
      if (lastYtState !== YT.PlayerState.PLAYING && lastYtState !== YT.PlayerState.BUFFERING) {
        appendHistory();
      }
      startHistoryLoop();
    } else if (st === YT.PlayerState.PAUSED) {
      saveCurrentSeconds();
      appendHistory();
    }
    lastYtState = st;
  }

  function onPlayerError() {
    const ph = $("yt-placeholder");
    if (ph) ph.textContent = "這集暫時不能播放，請按下一集";
    coverPlayer("這集暫時不能播放，請按下一集");
  }

  function syncToggleLabel() {
    const btn = $("btn-toggle");
    if (!btn) return;
    let playing = false;
    try {
      if (ytPlayer && window.YT && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
        playing = true;
      }
    } catch (e) {}
    btn.textContent = playing ? "暫停" : "播放";
  }

  function togglePlay() {
    if (!ytPlayer) return;
    try {
      const st = ytPlayer.getPlayerState();
      if (window.YT && st === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        uncoverPlayer();
        ytPlayer.playVideo();
      }
    } catch (e) {}
    setTimeout(syncToggleLabel, 200);
  }

  function saveCurrentSeconds() {
    if (!playCtx || !ytPlayer) return;
    try {
      const t = ytPlayer.getCurrentTime();
      if (typeof t === "number" && !isNaN(t)) {
        setProgress(playCtx.series.id, {
          index: playCtx.index,
          seconds: Math.max(0, Math.floor(t)),
          finished: false
        });
      }
    } catch (e) {}
  }

  function startSaveLoop() {
    clearInterval(saveTimer);
    saveTimer = setInterval(saveCurrentSeconds, 5000);
  }

  function startHistoryLoop() {
    if (histTimer) return;
    histTimer = setInterval(function () {
      if (!playCtx || !ytPlayer) return;
      try {
        if (window.YT && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
          saveCurrentSeconds();
          appendHistory();
        }
      } catch (e) {}
    }, 60000);
  }

  function changeEpisode(delta, reason) {
    if (!playCtx) return;
    saveCurrentSeconds();
    if (reason !== "ended") appendHistory();
    const next = playCtx.index + delta;
    const series = playCtx.series;
    if (next < 0) return;
    if (next >= series.videos.length) {
      setProgress(series.id, { index: series.videos.length - 1, seconds: 0, finished: true });
      if (reason === "ended") maybeAutoBackup();
      renderFinished(series.name);
      return;
    }
    const samePage = $("player-page");
    playCtx.index = next;
    setProgress(series.id, { index: next, seconds: 0, finished: false });
    if (samePage) {
      if (location.hash !== "#/play/" + encodeURIComponent(series.id) + "/" + next) {
        history.replaceState(null, "", "#/play/" + encodeURIComponent(series.id) + "/" + next);
      }
      updatePlayerChrome();
      createOrLoadPlayer(series.videos[next], 0);
    } else {
      goPlay(series.id, next);
    }
    if (reason === "ended") maybeAutoBackup();
  }

  function teardownPlayer() {
    clearInterval(saveTimer);
    saveTimer = null;
    clearInterval(histTimer);
    histTimer = null;
    lastYtState = null;
    clearTimeout(finishedTimer);
    finishedTimer = null;
    ignoreEnded = true;
    if (ytPlayer) {
      try { ytPlayer.stopVideo(); } catch (e) {}
      try { ytPlayer.destroy(); } catch (e) {}
      ytPlayer = null;
    }
    playCtx = null;
  }

  function route() {
    const r = parseRoute();
    if (r.page === "play") {
      if (playCtx && playCtx.series.id === r.id && playCtx.index === r.index && $("player-page")) {
        return;
      }
      renderPlayer(r.id, r.index);
    } else {
      renderHome();
    }
  }

  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const r = parseRoute();
    if (r.page === "play") {
      if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        if ($("app").querySelector(".finished")) {
          goHome();
          return;
        }
        togglePlay();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        changeEpisode(-1);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        changeEpisode(1);
      }
      return;
    }
    const cards = Array.prototype.slice.call(document.querySelectorAll(".btn-continue, .series-card"));
    if (!cards.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const i = cards.indexOf(document.activeElement);
      const start = i < 0 ? (e.key === "ArrowDown" ? -1 : 0) : i;
      const next = e.key === "ArrowDown"
        ? Math.min(start + 1, cards.length - 1)
        : Math.max(start - 1, 0);
      cards[next].focus();
    }
  });

  function onLeavePage() {
    saveCurrentSeconds();
    maybeAutoBackup();
  }
  window.addEventListener("hashchange", route);
  window.addEventListener("beforeunload", onLeavePage);
  window.addEventListener("pagehide", onLeavePage);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) onLeavePage();
  });

  route();
  </script>

</body>
